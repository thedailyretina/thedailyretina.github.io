name: Update issues

on:
  schedule:
    # Weekdays (UTC). Issues go out around 11:00 UTC, so check every 20 minutes through the
    # morning (GitHub often starts scheduled runs late or skips one), then a few times later.
    - cron: "7,27,47 11-14 * * 1-5"
    - cron: "23 17,20,23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull sent issues from the Buttondown feed
        run: python scripts/update_issues.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- issues.json; then
            echo "No new issues."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add issues.json
            git commit -m "Add new issues"
            git push
          fi
